name: integrity proof regression

on:
  push:
    paths:
      - "AGENTS.md"
      - "prompts/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/v3-2-proof-regression.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "prompts/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/v3-2-proof-regression.yml"
  workflow_dispatch:

jobs:
  v3-3-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML
      - name: Compile verifier and test suite
        run: |
          python -m py_compile tools/verify_integrity_proof.py
          python -m py_compile tools/build_artifact_manifest.py
          python -m py_compile tools/validate_project_artifacts.py
          python -m py_compile tools/export_tts_text.py
          python -m py_compile tools/validate_tts_export.py
          python -m py_compile tests/test_v3_3_adversarial.py
          python -m py_compile tests/test_tts_export.py
      - name: Run v3.3 adversarial mutation tests
        run: python -m unittest -v tests.test_v3_3_adversarial
      - name: Run seven-language TTS export tests
        run: python -m unittest -v tests.test_tts_export
